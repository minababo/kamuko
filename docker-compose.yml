services:
  client:
    build: ./client
    container_name: takeaway_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
  mongo:
    image: mongo:7
    container_name: takeaway_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: takeaway_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://root:rootpassword@mongo:27017/takeaway?authSource=admin
      JWT_SECRET: change_this_later
    depends_on:
      - mongo
    volumes:
      - ./api:/app
      - /app/node_modules

  mongo-express:
    image: mongo-express:1.0.2
    container_name: takeaway_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_SERVER: mongo

volumes:
  mongo_data:
